<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>New quiz response received</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.6;
        color: #333333;
        background-color: #f5f5f5;
        padding: 20px;
      }
      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .email-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 40px 30px;
        text-align: center;
      }
      .email-header h1 {
        color: #ffffff;
        font-size: 28px;
        font-weight: 600;
        margin: 0;
      }
      .email-body {
        padding: 40px 30px;
      }
      .email-body p {
        font-size: 16px;
        color: #666666;
        margin-bottom: 20px;
        text-align: center;
      }
      .icon-container {
        text-align: center;
        margin: 30px 0;
      }
      .icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: #ffffff;
      }
      .button-container {
        text-align: center;
        margin: 30px 0;
      }
      .button {
        display: inline-block;
        padding: 14px 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      .email-footer {
        padding: 30px;
        text-align: center;
        border-top: 1px solid #e9ecef;
        background-color: #f8f9fa;
      }
      .email-footer p {
        font-size: 14px;
        color: #999999;
        margin: 0;
      }
      @media only screen and (max-width: 600px) {
        body {
          padding: 10px;
        }
        .email-header {
          padding: 30px 20px;
        }
        .email-header h1 {
          font-size: 24px;
        }
        .email-body {
          padding: 30px 20px;
        }
        .icon {
          width: 60px;
          height: 60px;
          font-size: 30px;
        }
        .button {
          padding: 12px 24px;
          font-size: 14px;
        }
        .email-footer {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="email-header">
        <h1>New Quiz Response</h1>
      </div>
      <div class="email-body">
        <div class="icon-container">
          <div class="icon">🎉</div>
        </div>
        <p>Hello!</p>
        <p>You have received a new response to your quiz.</p>
        <div class="button-container">
          <a href="{{REPORT_URL}}" class="button">View Response</a>
        </div>
        <p>Thank you for using our service!</p>
      </div>
      <div class="email-footer">
        <p>This is an automatic notification. Please do not reply to this email.</p>
      </div>
    </div>
  </body>
</html>
