<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Код верификации</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.6;
        color: #333333;
        background-color: #f5f5f5;
        padding: 20px;
      }
      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .email-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 40px 30px;
        text-align: center;
      }
      .email-header h1 {
        color: #ffffff;
        font-size: 28px;
        font-weight: 600;
        margin: 0;
      }
      .email-body {
        padding: 40px 30px;
      }
      .email-body p {
        font-size: 16px;
        color: #666666;
        margin-bottom: 30px;
        text-align: center;
      }
      .code-container {
        background-color: #f8f9fa;
        border-radius: 8px;
        padding: 30px;
        text-align: center;
        margin: 30px 0;
      }
      .code {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 8px;
        color: #667eea;
        font-family: 'Courier New', monospace;
      }
      .email-footer {
        padding: 30px;
        text-align: center;
        border-top: 1px solid #e9ecef;
        background-color: #f8f9fa;
      }
      .email-footer p {
        font-size: 14px;
        color: #999999;
        margin: 0;
      }
      .warning-text {
        font-size: 14px;
        color: #999999;
        margin-top: 20px;
        text-align: center;
      }
      @media only screen and (max-width: 600px) {
        body {
          padding: 10px;
        }
        .email-header {
          padding: 30px 20px;
        }
        .email-header h1 {
          font-size: 24px;
        }
        .email-body {
          padding: 30px 20px;
        }
        .code {
          font-size: 28px;
          letter-spacing: 6px;
        }
        .email-footer {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="email-header">
        <h1>Код верификации</h1>
      </div>
      <div class="email-body">
        <p>Используйте этот код для подтверждения вашего email адреса:</p>
        <div class="code-container">
          <div class="code">{{CODE}}</div>
        </div>
        <p class="warning-text">
          Этот код действителен в течение 10 минут. Никому не сообщайте этот код.
        </p>
      </div>
      <div class="email-footer">
        <p>Если вы не запрашивали этот код, просто проигнорируйте это письмо.</p>
      </div>
    </div>
  </body>
</html>
