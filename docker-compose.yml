version: '3.9'
services:
  postgres:
    image: postgres:16.1-alpine3.19
    container_name: tg-postgres
    environment:
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB variable is not set}'
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER variable is not set}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD variable is not set}'
    command:
      - 'postgres'
      - '-c'
      - 'max_connections=50'
      - '-c'
      - 'shared_buffers=1GB'
      - '-c'
      - 'effective_cache_size=4GB'
      - '-c'
      - 'work_mem=16MB'
      - '-c'
      - 'maintenance_work_mem=512MB'
      - '-c'
      - 'random_page_cost=1.1'
      - '-c'
      - 'temp_file_limit=10GB'
      - '-c'
      - 'log_min_duration_statement=200ms'
      - '-c'
      - 'idle_in_transaction_session_timeout=10s'
      - '-c'
      - 'lock_timeout=1s'
      - '-c'
      - 'statement_timeout=60s'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'pg_stat_statements.max=10000'
      - '-c'
      - 'pg_stat_statements.track=all'
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?POSTGRES_USER variable is not set} -d ${POSTGRES_DB:?POSTGRES_DB variable is not set}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    env_file:
      - .env
    networks:
      - quizgram-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: quizgram-api
    # Используем host network - контейнер будет доступен напрямую на порту 5001 хоста
    # При host network порты не маппятся через ports:, контейнер использует сеть хоста напрямую
    # POSTGRES_HOST должен быть localhost, так как postgres доступен через порт 5432 на хосте
    network_mode: host
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB variable is not set}'
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER variable is not set}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD variable is not set}'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - pkg/api/.env
    volumes:
      # Монтируем директорию логов на хост для сохранения при перезапуске контейнера
      - ./logs/api:/app/pkg/api/logs

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: quizgram-app
    # Используем host network - контейнер будет доступен напрямую на порту 5173 хоста
    # При host network порты не маппятся через ports:, контейнер использует сеть хоста напрямую
    network_mode: host
    restart: unless-stopped

  tg-quiz:
    build:
      context: .
      dockerfile: Dockerfile.tg-quiz
    container_name: quizgram-tg-quiz
    # Используем host network - контейнер будет доступен напрямую на порту 5174 хоста
    # При host network порты не маппятся через ports:, контейнер использует сеть хоста напрямую
    network_mode: host
    restart: unless-stopped

networks:
  quizgram-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local

# Директории логов монтируются напрямую на хост (bind mount)
# Логи API сохраняются в ./logs/api на хосте
