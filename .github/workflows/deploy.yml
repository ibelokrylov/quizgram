name: Deploy Quizgram

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Установка Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install

      - name: Проверка обязательных секретов
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "ERROR: SSH_KEY secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "ERROR: SERVER_IP secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "ERROR: SERVER_PORT secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "ERROR: SERVER_USER secret is not set!"
            exit 1
          fi
          echo "All required secrets are set"

      - name: Сборка pkg/app
        run: |
          cd pkg/app
          bun run build

      - name: Сборка pkg/tg-quiz
        run: |
          cd pkg/tg-quiz
          bun run build

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "${{ secrets.SERVER_PORT }}" ] && [ -n "${{ secrets.SERVER_IP }}" ]; then
            ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          else
            echo "Warning: SERVER_PORT or SERVER_IP is not set, skipping ssh-keyscan"
          fi
        shell: /usr/bin/bash -e {0}

      - name: Debug SSH setup
        run: |
          ls -la ~/.ssh
          cat ~/.ssh/known_hosts
          echo "SSH_KEY length: $(wc -c < ~/.ssh/id_rsa)"
          echo "SERVER_USER: ${{ secrets.SERVER_USER }}"
          echo "SERVER_HOST: ${{ secrets.SERVER_IP }}"
          echo "SERVER_PORT: ${{ secrets.SERVER_PORT }}"
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "ERROR: SERVER_PORT is not set!"
          fi
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "ERROR: SERVER_IP is not set!"
          fi
          if [ -z "${{ secrets.SSH_KEY }}" ]; then
            echo "ERROR: SSH_KEY is not set!"
          fi

      - name: Проверка SSH подключения
        run: |
          ssh -v -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful'"

      - name: Обновление кода на сервере
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            git fetch
            git pull
          EOF

      - name: Создание корневого .env файла
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/.env << ENV
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            
            DATABASE_URL=postgresql://\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@\${POSTGRES_HOST}:\${POSTGRES_PORT}/\${POSTGRES_DB}
            
            
            # Environment flag
            IS_DEV=${{ secrets.IS_DEV }}
          ENV
          EOF

      - name: Создание pkg/api/.env файла
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/pkg/api/.env << ENV
            ENV=${{ secrets.API_ENV }}
            POSTGRES_USER=${{ secrets.API_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.API_POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.API_POSTGRES_DB }}
            POSTGRES_PORT=${{ secrets.API_POSTGRES_PORT }}
            POSTGRES_HOST=${{ secrets.API_POSTGRES_HOST }}
            
            JWT_SECRET=${{ secrets.API_JWT_SECRET }}
            COOKIE_SECRET=${{ secrets.API_COOKIE_SECRET }}
            
            DATABASE_URL=postgresql://\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@\${POSTGRES_HOST}:\${POSTGRES_PORT}/\${POSTGRES_DB}
            
            MAIL_USER=${{ secrets.API_MAIL_USER }}
            MAIL_PASS=${{ secrets.API_MAIL_PASS }}
            MAIL_HOST=${{ secrets.API_MAIL_HOST }}
            MAIL_PORT=${{ secrets.API_MAIL_PORT }}
            
            URL_ORIGIN=${{ secrets.API_URL_ORIGIN }}
            PORT=${{ secrets.API_PORT }}
            APP_NAME=${{ secrets.API_APP_NAME }}
            APP_URLS=${{ secrets.API_APP_URLS }}
            
            
            S3_URL=${{ secrets.API_S3_URL }}
            S3_BUCKET_NAME=${{ secrets.API_S3_BUCKET_NAME }}
            S3_ACCESS_KEY=${{ secrets.API_S3_ACCESS_KEY }}
            S3_SECRET_ACCESS_KEY=${{ secrets.API_S3_SECRET_ACCESS_KEY }}
            S3_SWIFT_URL=${{ secrets.API_S3_SWIFT_URL }}
            S3_SWIFT_ACCESS_KEY=${{ secrets.API_S3_SWIFT_ACCESS_KEY }}
            S3_SWIFT_SECRET_ACCESS_KEY=${{ secrets.API_S3_SWIFT_SECRET_ACCESS_KEY }}
            S3_REGION=${{ secrets.API_S3_REGION }}
            
            BOT_QUIZ_TOKEN=${{ secrets.API_BOT_QUIZ_TOKEN }}
            BOT_CRM_TOKEN=${{ secrets.API_BOT_CRM_TOKEN }}
          ENV
          EOF

      - name: Создание pkg/app/.env файла
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/pkg/app/.env << ENV
            VITE_PUBLIC_API_URL = '${{ secrets.APP_VITE_PUBLIC_API_URL }}'
            VITE_PUBLIC_APP_NAME = '${{ secrets.APP_VITE_PUBLIC_APP_NAME }}'
            VITE_PUBLIC_QUIZ_URL = '${{ secrets.APP_VITE_PUBLIC_QUIZ_URL }}'
          ENV
          EOF

      - name: Создание pkg/tg-quiz/.env файла
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/pkg/tg-quiz/.env << ENV
            # API URL для backend
            VITE_TG_QUIZ_API_URL=${{ secrets.TG_QUIZ_VITE_TG_QUIZ_API_URL }}
          ENV
          EOF

      - name: Перезапуск контейнеров через docker-compose
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            docker-compose down
            docker-compose up -d --build
          EOF
