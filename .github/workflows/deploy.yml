name: Deploy to Server

# Мануальный деплой на сервер с перезапуском контейнеров
on:
  workflow_dispatch:
    inputs:
      skip_git_pull:
        description: 'Пропустить git pull (использовать текущий код на сервере)'
        required: false
        default: false
        type: boolean
      skip_env_update:
        description: 'Пропустить обновление .env файлов'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Деплой на сервер
    runs-on: ubuntu-latest
    environment: prod
    
    steps:
      - name: Проверка обязательных секретов
        run: |
          if [ -z "${{ secrets.SERVER_PASS }}" ]; then
            echo "❌ ERROR: SERVER_PASS secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "❌ ERROR: SERVER_IP secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "❌ ERROR: SERVER_PORT secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "❌ ERROR: SERVER_USER secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_HUB_LOGIN }}" ]; then
            echo "❌ ERROR: DOCKER_HUB_LOGIN secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then
            echo "❌ ERROR: DOCKER_HUB_TOKEN secret is not set!"
            exit 1
          fi
          echo "✅ Все обязательные секреты установлены"

      - name: Установка sshpass для SSH аутентификации
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SERVER_PORT }}" ] && [ -n "${{ secrets.SERVER_IP }}" ]; then
            ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          else
            echo "⚠️ Warning: SERVER_PORT or SERVER_IP is not set, skipping ssh-keyscan"
          fi
        shell: /usr/bin/bash -e {0}

      - name: Проверка SSH подключения
        run: |
          echo "Проверка подключения к серверу..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -v -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo '✅ SSH подключение успешно'"

      - name: Обновление кода на сервере
        if: ${{ !inputs.skip_git_pull }}
        run: |
          echo "Обновление кода из Git репозитория..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            git fetch
            git pull
            echo "✅ Код обновлён"
          EOF

      - name: Пропуск обновления кода
        if: ${{ inputs.skip_git_pull }}
        run: |
          echo "⏭️ Обновление кода пропущено (используется текущий код на сервере)"

      - name: Создание корневого .env файла
        if: ${{ !inputs.skip_env_update }}
        run: |
          echo "Создание корневого .env файла..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/.env << ENV
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            
            # Environment flag
            IS_DEV=${{ secrets.IS_DEV }}
          ENV
          EOF

      - name: Создание pkg/api/.env файла
        if: ${{ !inputs.skip_env_update }}
        run: |
          echo "Создание .env файла для API..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/pkg/api/.env << ENV
            ENV=${{ secrets.ENV }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
            
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            
            MAIL_USER=${{ secrets.MAIL_USER }}
            MAIL_PASS=${{ secrets.MAIL_PASS }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            
            PORT=${{ secrets.PORT }}
            APP_NAME=${{ secrets.APP_NAME }}
            APP_URLS=${{ secrets.APP_URLS }}
            
            S3_URL=${{ secrets.S3_URL }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_SWIFT_URL=${{ secrets.S3_SWIFT_URL }}
            S3_SWIFT_ACCESS_KEY=${{ secrets.S3_SWIFT_ACCESS_KEY }}
            S3_SWIFT_SECRET_ACCESS_KEY=${{ secrets.S3_SWIFT_SECRET_ACCESS_KEY }}
            S3_REGION=${{ secrets.S3_REGION }}
            
            BOT_QUIZ_TOKEN=${{ secrets.BOT_TOKEN }}
            BOT_CRM_TOKEN=${{ secrets.BOT_TOKEN_DEV }}
          ENV
          EOF

      - name: Создание pkg/app/.env файла
        if: ${{ !inputs.skip_env_update }}
        run: |
          echo "Создание .env файла для frontend..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/pkg/app/.env << ENV
            VITE_PUBLIC_API_URL='${{ secrets.VITE_PUBLIC_API_URL }}'
            VITE_PUBLIC_APP_NAME='${{ secrets.VITE_PUBLIC_APP_NAME }}'
            VITE_PUBLIC_QUIZ_URL='${{ secrets.VITE_PUBLIC_QUIZ_URL }}'
          ENV
          EOF

      - name: Создание pkg/tg-quiz/.env файла
        if: ${{ !inputs.skip_env_update }}
        run: |
          echo "Создание .env файла для Telegram Mini App..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            cat > /root/quizgram/pkg/tg-quiz/.env << ENV
            # API URL для backend
            VITE_TG_QUIZ_API_URL=${{ secrets.VITE_TG_QUIZ_API_URL }}
          ENV
          EOF

      - name: Пропуск обновления .env файлов
        if: ${{ inputs.skip_env_update }}
        run: |
          echo "⏭️ Обновление .env файлов пропущено"

      - name: Авторизация в Docker Hub на сервере
        run: |
          echo "Авторизация в Docker Hub..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_LOGIN }}" --password-stdin
            echo "✅ Авторизация в Docker Hub успешна"
          EOF

      - name: Перезапуск контейнеров (app, api, tg-quiz)
        run: |
          echo "Перезапуск контейнеров с пересборкой..."
          echo "Контейнеры для перезапуска: app, api, tg-quiz"
          echo "PostgreSQL контейнер НЕ будет перезапущен"
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            docker compose up -d --build app api tg-quiz
            echo "✅ Контейнеры перезапущены"
          EOF

      - name: Проверка статуса контейнеров
        run: |
          echo "Проверка статуса всех контейнеров..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            echo "=== Статус контейнеров ==="
            docker compose ps
          EOF

      - name: Показать последние логи
        run: |
          echo "Последние 30 строк логов перезапущенных контейнеров..."
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            echo "=== Логи API ==="
            docker compose logs --tail=10 api
            echo ""
            echo "=== Логи APP ==="
            docker compose logs --tail=10 app
            echo ""
            echo "=== Логи TG-QUIZ ==="
            docker compose logs --tail=10 tg-quiz
          EOF

      - name: Итоговый отчёт
        run: |
          echo ""
          echo "✅ Деплой завершён успешно!"
          echo ""
          echo "Перезапущенные контейнеры:"
          echo "  - app (frontend)"
          echo "  - api (backend)"
          echo "  - tg-quiz (Telegram Mini App)"
          echo ""
          echo "PostgreSQL контейнер не перезапускался"
