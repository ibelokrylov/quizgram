name: Restart Containers

# Этот workflow запускается только вручную через кнопку в GitHub Actions
on:
  workflow_dispatch:
    inputs:
      containers:
        description: 'Какие контейнеры перезапустить'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - app
          - tg-quiz
          - postgres
      rebuild:
        description: 'Пересобрать образы перед перезапуском'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  restart:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Проверка обязательных секретов
        run: |
          if [ -z "${{ secrets.SERVER_PASS }}" ]; then
            echo "ERROR: SERVER_PASS secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "ERROR: SERVER_IP secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_PORT }}" ]; then
            echo "ERROR: SERVER_PORT secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then
            echo "ERROR: SERVER_USER secret is not set!"
            exit 1
          fi
          echo "All required secrets are set"

      - name: Установка sshpass для SSH аутентификации
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SERVER_PORT }}" ] && [ -n "${{ secrets.SERVER_IP }}" ]; then
            ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
          else
            echo "Warning: SERVER_PORT or SERVER_IP is not set, skipping ssh-keyscan"
          fi
        shell: /usr/bin/bash -e {0}

      - name: Проверка SSH подключения
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -v -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH connection successful'"

      - name: Определение команды для контейнеров
        id: containers
        run: |
          CONTAINERS="${{ github.event.inputs.containers }}"
          if [ "$CONTAINERS" = "all" ]; then
            echo "containers=api app tg-quiz" >> $GITHUB_OUTPUT
          else
            echo "containers=$CONTAINERS" >> $GITHUB_OUTPUT
          fi

      - name: Перезапуск контейнеров (с пересборкой)
        if: github.event.inputs.rebuild == 'true'
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            echo "Перезапуск контейнеров с пересборкой: ${{ steps.containers.outputs.containers }}"
            docker compose up -d --build ${{ steps.containers.outputs.containers }}
            echo "Контейнеры перезапущены"
          EOF

      - name: Перезапуск контейнеров (без пересборки)
        if: github.event.inputs.rebuild == 'false'
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            echo "Перезапуск контейнеров без пересборки: ${{ steps.containers.outputs.containers }}"
            docker compose restart ${{ steps.containers.outputs.containers }}
            echo "Контейнеры перезапущены"
          EOF

      - name: Проверка статуса контейнеров
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            echo "Статус контейнеров:"
            docker compose ps
          EOF

      - name: Показать последние логи
        run: |
          sshpass -p "${{ secrets.SERVER_PASS }}" ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /root/quizgram
            echo "Последние 20 строк логов:"
            docker compose logs --tail=20 ${{ steps.containers.outputs.containers }}
          EOF
