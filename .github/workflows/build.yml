name: Build All Packages

# Автоматическая сборка всех пакетов при push в main
on:
  push:
    branches:
      - main
    paths:
      # Запускать сборку только при изменении кода пакетов
      - 'pkg/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pkg/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  build:
    name: Сборка пакетов
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Установка Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install

      - name: Проверка TypeScript (pkg/api)
        run: |
          cd pkg/api
          echo "Проверка типов для API..."
          bun x tsc --noEmit || true

      - name: Сборка pkg/app
        run: |
          cd pkg/app
          echo "Сборка frontend приложения..."
          bun run build

      - name: Сборка pkg/tg-quiz
        run: |
          cd pkg/tg-quiz
          echo "Сборка Telegram Mini App..."
          bun run build

      - name: Проверка результатов сборки
        run: |
          echo "=== Проверка pkg/app/dist ==="
          if [ -d "pkg/app/dist" ]; then
            echo "✅ pkg/app/dist создан"
            ls -lah pkg/app/dist
          else
            echo "❌ pkg/app/dist не найден"
            exit 1
          fi
          
          echo ""
          echo "=== Проверка pkg/tg-quiz/dist ==="
          if [ -d "pkg/tg-quiz/dist" ]; then
            echo "✅ pkg/tg-quiz/dist создан"
            ls -lah pkg/tg-quiz/dist
          else
            echo "❌ pkg/tg-quiz/dist не найден"
            exit 1
          fi

      - name: Загрузка артефактов сборки
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            pkg/app/dist/
            pkg/tg-quiz/dist/
          retention-days: 7

      - name: Итоговый отчёт
        run: |
          echo "✅ Все пакеты успешно собраны!"
          echo ""
          echo "Артефакты сборки:"
          echo "  - pkg/app/dist"
          echo "  - pkg/tg-quiz/dist"
          echo ""
          echo "Для деплоя на сервер запустите workflow 'Deploy to Server' вручную"
